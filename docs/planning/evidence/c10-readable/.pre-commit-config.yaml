repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check (project dependency, read-only)
        entry: ruff check
        language: system
        types_or: [python, pyi]
      - id: ruff-format-check
        name: ruff format check (read-only)
        entry: ruff format --check
        language: system
        types_or: [python, pyi]
      - id: mypy-project
        name: mypy (project dependency and Pydantic plugin)
        entry: mypy src tests
        language: system
        types_or: [python, pyi]
        pass_filenames: false
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e  # v8.30.1
    hooks:
      - id: gitleaks-system
        pass_filenames: false
