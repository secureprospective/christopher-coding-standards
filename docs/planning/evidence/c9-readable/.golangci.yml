# Selected correctness/security checks, not a universal architecture or size policy.
version: "2"
run:
  timeout: 5m
  concurrency: 1
linters:
  default: none
  enable:
    - gosec
    - errcheck
    - govet
    - staticcheck
    - ineffassign
    - unused
    - bodyclose
    - sqlclosecheck
    - rowserrcheck
    - nilerr
    - nolintlint
  settings:
    errcheck:
      check-blank: true
    nolintlint:
      require-explanation: true
      require-specific: true
      allow-unused: false
  exclusions:
    generated: strict
    warn-unused: true
formatters:
  enable:
    - gofmt
    - goimports
