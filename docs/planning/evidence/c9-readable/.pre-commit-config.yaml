repos:
  # Owner installs/verifies selected native tool; no implicit toolchain bootstrap.
  - repo: local
    hooks:
      - id: golangci-lint
        name: golangci-lint (project configuration)
        entry: golangci-lint run ./...
        language: system
        types: [go]
        pass_filenames: false
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e  # v8.30.1
    hooks:
      - id: gitleaks-system
        pass_filenames: false
