# Exact documented synthetic key ID in historical guardrail examples, not
# arbitrary AWS keys or README files. Never use this as an actual credential.
[[allowlists]]
targetRules = ["aws-access-token"]
description = "Exact deterministic public AWS-pattern synthetic fixture"
# Exact public synthetic detector fixture, not a credential or a general AWS exemption.
# nosemgrep: generic.secrets.security.detected-aws-access-key-id-value.detected-aws-access-key-id-value
regexes = ['''^AKIAABCDEFGHIJKLMNOP$''']
