# Kit/history scan uses default rules without blanket README/docs/example exemptions.
# Add only demonstrated, narrowly identified harmless exceptions with review evidence.
# Default rules and a clean scan still do not prove absence of every credential.
[extend]
useDefault = true

# Demonstrated native8.30.1 false positive: public golangci2.14.0 release
# changelog's37 Git commit IDs on one JSON line near the word Sourcegraph.
# Rule AND exact path AND exact public value; no new/different token exemption.
[[allowlists]]
targetRules = ["sourcegraph-access-token"]
condition = "AND"
description = "Exact public release changelog commit IDs in unchanged C9 archive"
paths = ['''^docs/planning/evidence/c9-metadata\.json$''']
