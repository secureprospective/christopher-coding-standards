# Merge with existing project hooks; pins identify source, not trust/enforcement.
repos:
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: 745eface02aef23e168a8afb6b5737818efbea95  # v0.11.0.1; native ShellCheck0.11.0
    hooks:
      - id: shellcheck
        # Bats behavior is checked by the test target, not the .sh lint set.
        exclude: '\.bats$'

  - repo: https://github.com/scop/pre-commit-shfmt
    rev: 05c1426671b9237fb5e1444dd63aa5731bec0dfb  # v3.13.1-1; native shfmt3.13.1
    hooks:
      - id: shfmt
        # Custom args replace defaults: retain -w so changes reject the commit.
        args: ["-w", "-i", "2", "-ci", "-sr"]
        exclude: '\.bats$'

  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e  # v8.30.1
    hooks:
      # Use the owner-installed verified binary; no implicit Go SDK bootstrap.
      - id: gitleaks-system
        # CLI scans the staged repository diff, not filename arguments.
        pass_filenames: false
