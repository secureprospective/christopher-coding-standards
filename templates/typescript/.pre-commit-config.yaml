repos:
  # Biome: format, organize imports, lint, apply safe fixes to staged files.
  # Pin rev to a commit SHA before running in production.
  # Get the SHA for any tag: git ls-remote https://github.com/biomejs/pre-commit <tag>
  # Automate SHA updates: add biomejs/pre-commit to your Renovate or Dependabot config.
  - repo: https://github.com/biomejs/pre-commit
    rev: "v2.4.16"  # TODO: pin to SHA — see note above
    hooks:
      - id: biome-check
        additional_dependencies: ["@biomejs/biome@2.4.15"]

  # Gitleaks: scan staged files for secrets before they enter git history.
  # Pin rev to a commit SHA before running in production.
  # Reason: supply chain attacks target mutable tags (see docs/adr/0001-why-this-standard-exists.md).
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.27.2  # TODO: pin to SHA
    hooks:
      - id: gitleaks
