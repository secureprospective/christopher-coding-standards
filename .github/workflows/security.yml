name: security

# Kit CI: actual copied references, not conditional application-root no-op jobs.
# Tool/rule graphs are explicit; CLI evidence is not proof of hosted execution.
on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'
permissions:
  contents: read
defaults:
  run:
    shell: bash

jobs:
  gitleaks:
    name: secrets — gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13.5'
      - name: Install selected owned checksum/hash-locked tools
        run: python3 tools/ci/install-tools.py gitleaks --directory "$RUNNER_TEMP/standards-tools"
      - name: Execute actual reference commands and intended-specific controls
        run: python3 tools/ci/check-security.py gitleaks --work "$RUNNER_TEMP/standards-checks"

  semgrep:
    name: sast — semgrep
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13.5'
      - name: Install selected owned checksum/hash-locked tools
        run: python3 tools/ci/install-tools.py semgrep --directory "$RUNNER_TEMP/standards-tools"
      - name: Verify purpose-specific complete-rule identity controls
        run: PYTHONPATH=tools/ci python3 -m unittest discover -s tools/ci/tests -v
      - name: Execute actual reference commands and intended-specific controls
        run: python3 tools/ci/check-security.py semgrep --work "$RUNNER_TEMP/standards-checks"

  trivy:
    name: sca — trivy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13.5'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6 observed ref
        with:
          node-version: '24.21.0'
      - name: Install selected owned checksum/hash-locked tools
        run: python3 tools/ci/install-tools.py trivy --directory "$RUNNER_TEMP/standards-tools"
      - name: Execute actual reference commands and intended-specific controls
        run: python3 tools/ci/check-security.py trivy --work "$RUNNER_TEMP/standards-checks"

  ts-lint:
    name: ts — lint
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13.5'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6 observed ref
        with:
          node-version: '24.21.0'
      - name: Install selected owned checksum/hash-locked tools
        run: python3 tools/ci/install-tools.py typescript --directory "$RUNNER_TEMP/standards-tools"
      - name: Execute actual reference commands and intended-specific controls
        run: python3 tools/ci/check-reference.py ts-lint --work "$RUNNER_TEMP/standards-checks"

  ts-test:
    name: ts — test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13.5'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6 observed ref
        with:
          node-version: '24.21.0'
      - name: Install selected owned checksum/hash-locked tools
        run: python3 tools/ci/install-tools.py typescript --directory "$RUNNER_TEMP/standards-tools"
      - name: Execute actual reference commands and intended-specific controls
        run: python3 tools/ci/check-reference.py ts-test --work "$RUNNER_TEMP/standards-checks"
