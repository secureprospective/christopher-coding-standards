name: verify-templates-bash

# Actual selected shipped references + diagnostic-specific controls. No arbitrary-error passes.
on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]
permissions:
  contents: read
defaults:
  run:
    shell: bash

jobs:
  bash-fixtures:
    name: bash overlay — fixtures pass/fail
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13.5'
      - name: Install selected owned checksum/hash-locked tools
        run: python3 tools/ci/install-tools.py bash --directory "$RUNNER_TEMP/standards-tools"
      - name: Execute actual reference commands and intended-specific controls
        run: python3 tools/ci/check-reference.py bash --work "$RUNNER_TEMP/standards-checks"
